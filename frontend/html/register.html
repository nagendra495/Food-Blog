<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · tasteful</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo"><i class="fas fa-utensils"></i><h1>taste<span>ful</span></h1></div>
    <p class="auth-subtitle">where recipes meet stories</p>
    <div class="auth-title"><i class="fas fa-seedling"></i> Create your account</div>
    <form id="registerForm">
      <div class="form-group"><label>Full name</label><input type="text" id="regName" placeholder="e.g. Julia Child" required></div>
      <div class="form-group"><label>Email address</label><input type="email" id="regEmail" placeholder="hello@tasteful.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="At least 6 characters" required></div>
      <button type="submit" class="btn btn-primary" id="regSubmitBtn"><i class="fas fa-user-plus"></i> Register</button>
    </form>
    <div id="registerMessage" class="message"></div>
    <div class="auth-switch">Already have an account? <a href="login.html">Sign in</a></div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
